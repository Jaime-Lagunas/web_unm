<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Práctica 4 - Eventos y Efectos</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body class="container mt-5">

<!--
==========================================
BOTÓN PRINCIPAL
==========================================

Será utilizado para aprender:

.click()

.mouseenter()

.mouseleave()

==========================================
-->

<button
id="btnMostrar"
class="btn btn-primary">

Mostrar Información

</button>

<!--
==========================================
PANEL
==========================================

Se ocultará al iniciar la página
mediante .hide()

y aparecerá con slideToggle()

==========================================
-->

<div id="panel"
     class="alert alert-info mt-4">

    Oaxaca es uno de los estados con mayor
    diversidad cultural de México.

</div>

<script>

$(document).ready(function(){

    /*
    ======================================
    .hide()
    ======================================

    Oculta inicialmente el panel.

    El usuario no lo verá al entrar.

    ======================================
    */

    $("#panel").hide();

    /*
    ======================================
    EVENTO CLICK
    ======================================

    Se activa cuando el usuario
    hace clic.

    ======================================
    */

    $("#btnMostrar").click(function(){

        /*
        ==================================
        slideToggle()
        ==================================

        Si está oculto:

            Lo muestra.

        Si está visible:

            Lo oculta.

        ==================================
        */

        $("#panel")
        .slideToggle(1000);

    });

    /*
    ======================================
    EVENTO MOUSEENTER
    ======================================

    Se activa cuando el puntero
    entra al botón.

    ======================================
    */

    $("#btnMostrar").mouseenter(function(){

        $(this)

        /*
        addClass()

        Agrega una clase Bootstrap.

        */

        .addClass("btn-success");

    });

    /*
    ======================================
    EVENTO MOUSELEAVE
    ======================================

    Ocurre cuando el puntero
    abandona el botón.

    ======================================
    */

    $("#btnMostrar").mouseleave(function(){

        $(this)

        /*
        removeClass()

        Elimina una clase.

        */

        .removeClass("btn-success");

    });

});

</script>

</body>

</html>
