<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Práctica 3 - DOM y CSS</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body class="container mt-5">

<!--
==========================================
TÍTULO
==========================================

Será modificado mediante:

.text()

==========================================
-->

<h1 id="titulo">

Dashboard Oaxaca

</h1>

<!--
==========================================
CONTENEDOR
==========================================

Su contenido será reemplazado
con .html()

==========================================
-->

<div id="contenido"
     class="mt-3">

    Información inicial.

</div>

<button
id="btnModificar"
class="btn btn-success mt-3">

Modificar Información

</button>

<script>

$(document).ready(function(){

    /*
    ======================================
    EVENTO CLICK
    ======================================

    Espera que el usuario pulse
    el botón.

    ======================================
    */

    $("#btnModificar").click(function(){

        /*
        ==================================
        .text()
        ==================================

        Cambia únicamente texto.

        No interpreta HTML.

        ==================================
        */

        $("#titulo")
        .text("Información Actualizada");

        /*
        ==================================
        .html()
        ==================================

        Inserta código HTML.

        Sí interpreta etiquetas.

        ==================================
        */

        $("#contenido")
        .html("<strong>Datos cargados correctamente.</strong>");

        /*
        ==================================
        .css()
        ==================================

        Permite modificar estilos CSS
        directamente desde jQuery.

        ==================================
        */

        $("#contenido")
        .css({

            "color":"blue",

            "font-size":"24px",

            "background-color":"#f8f9fa",

            "padding":"10px"

        });

    });

});

</script>

</body>

</html>
