<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6.3 Interacciones - Ejemplo 1: Arrastrar y Soltar (Draggable & Droppable)</title>

  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }
    /* Estilo de la tarjeta que se puede arrastrar */
    #tarea-arrastrable {
      width: 160px;
      padding: 15px;
      background-color: #0769ad;
      color: white;
      cursor: grab; /* Cambia el cursor a una mano */
      border-radius: 6px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      text-align: center;
      font-weight: bold;
    }
    /* Estilo de la zona destino donde se soltará la tarjeta */
    #zona-entrega {
      width: 300px;
      height: 150px;
      padding: 20px;
      margin-top: 30px;
      border: 2px dashed #666;
      background-color: #f4f6f8;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    /* Clase que aplicaremos dinámicamente cuando la tarjeta caiga dentro */
    .entregado {
      background-color: #d4edda !important;
      border: 2px solid #28a745 !important;
      color: #155724;
    }
  </style>
</head>
<body>

  <h2>6.3 Interacciones: Arrastrar y Soltar (Draggable & Droppable)</h2>
  <p>Haz clic sostenido sobre la tarjeta azul y arrástrala dentro del recuadro punteado:</p>

  <!-- Elemento arrastrable -->
  <div id="tarea-arrastrable">Práctica de Web</div>

  <!-- Zona receptora -->
  <div id="zona-entrega">Buzón de Entrega<br>(Suelta la tarjeta aquí)</div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>

  <script>
    $(function() {
      // 1. .draggable() habilita que el usuario pueda mover el elemento con el ratón
      $("#tarea-arrastrable").draggable({
        cursor: "grabbing" // Cambia el cursor mientras se está arrastrando
      });

      // 2. .droppable() convierte el contenedor en una zona que detecta elementos soltados encima
      $("#zona-entrega").droppable({
        // La función 'drop' se ejecuta automáticamente en el instante en que sueltan el elemento
        drop: function(event, ui) {
          // $(this) hace referencia a #zona-entrega
          $(this)
            .addClass("entregado")
            .html("<strong>¡Tarea recibida con éxito!</strong>");

          // ui.draggable hace referencia al elemento exacto que fue soltado
          ui.draggable.css("background-color", "#28a745");
        }
      });
    });

    /* RETO PARA PRACTICAR:
       Agrega la opción `revert: "invalid"` dentro de .draggable({ ... })
       para que, si el usuario suelta la tarjeta fuera del buzón, regrese sola
       a su posición original. */
  </script>
</body>
</html>
