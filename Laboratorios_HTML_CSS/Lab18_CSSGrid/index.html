<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura Periódico con CSS Grid</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="grid-layout">
        <header class="item header">Encabezado de la Gaceta</header>
        <main class="item principal">Noticia Principal (Ocupa más espacio)</main>
        <aside class="item lateral">Barra Lateral / Anuncios</aside>
        <section class="item extra">Noticia Secundaria A</section>
        <section class="item extra2">Noticia Secundaria B</section>
        <footer class="item footer">Pie de página informativo</footer>
    </div>
</body>
</html>
