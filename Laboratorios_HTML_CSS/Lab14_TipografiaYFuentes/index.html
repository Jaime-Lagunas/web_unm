<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipografía y Unidades</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <article class="articulo">
        <h1>Diseño Tipográfico en la Web</h1>
        <p class="lead">Las unidades relativas como <code>rem</code> e <code>em</code> permiten escalar interfaces de forma accesible.</p>
        <p>Un <code>rem</code> equivale al tamaño de fuente raíz del documento (por defecto 16px). Si cambiamos la raíz, toda la maquetación se adapta proporcionalmente.</p>
    </article>
</body>
</html>
