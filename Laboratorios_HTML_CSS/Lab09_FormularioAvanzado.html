<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta Universitaria</title>
</head>
<body>
    <h1>Encuesta de Hábitos de Estudio</h1>
    <form action="#" method="POST">
        <fieldset>
            <legend>Datos Académicos y Preferencias</legend>
            <label for="fecha">Fecha de Nacimiento:</label>
            <input type="date" id="fecha" name="fecha_nacimiento"><br><br>
            <label for="horas">Horas de estudio semanales:</label>
            <input type="number" id="horas" name="horas" min="1" max="50" value="10"><br><br>
            <label for="semestre">Semestre Actual:</label>
            <select id="semestre" name="semestre">
                <option value="1">Primero</option>
                <option value="2">Segundo</option>
                <option value="3">Tercero</option>
            </select><br><br>
            <label for="color">Color de tema preferido para la plataforma:</label>
            <input type="color" id="color" name="tema_color" value="#0055ff"><br><br>
            <label for="archivo">Adjuntar Carnet (PDF/Imagen):</label>
            <input type="file" id="archivo" name="carnet" accept=".pdf, image/*"><br><br>
        </fieldset>
        <br>
        <button type="submit">Guardar Encuesta</button>
    </form>
</body>
</html>
