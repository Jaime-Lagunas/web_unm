<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Cursos</title>
    <style>
        body { background-color: #fafafa; font-family: Arial, sans-serif; }
        h1 { color: #333333; text-align: center; }
        .curso-card { background-color: white; border: 1px solid #cccccc; padding: 15px; margin-bottom: 10px; }
        .destacado { border-left: 5px solid #28a745; }
        #curso-principal { background-color: #e9ecef; }
    </style>
</head>
<body>
    <h1>Oferta Académica</h1>
    <div class="curso-card destacado" id="curso-principal">
        <h2>Desarrollo Web Front-End</h2>
        <p>Aprende HTML5, CSS3 y JavaScript desde cero.</p>
    </div>
    <div class="curso-card">
        <h2>Bases de Datos I</h2>
        <p>Diseño conceptual, relacional y lenguaje SQL.</p>
    </div>
</body>
</html>
